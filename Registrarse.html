<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="MidasWallet: Ayuda a gestionar tus finanzas personales con tecnología avanzada y un enfoque centrado en el usuario. ¡Descarga el APK!"
    />

    <title>MidasWallet - Registrarse</title>

    <link
      rel="icon"
      href="Recursos/ic_launcher_round.webp"
      type="image/x-icon"
    />

    <link rel="stylesheet" href="Styles.css" />
  </head>
  <body>
    <nav class="navbar">
      <a href="index.html" class="navbar-logo">
        <img
          src="Recursos/ic_launcher_round.webp"
          alt="Logo MidasWallet"
          class="logo"
        />
      </a>

      <div class="navbar-links">
        <a href="Politicas.html">
          <button class="nav-btn policies-nav-btn">Políticas</button>
        </a>

        <a href="InicioSesion.html">
          <button class="nav-btn">Iniciar Sesión</button>
        </a>

        <a href="Registrarse.html">
          <button class="nav-btn">Registrarse</button>
        </a>
      </div>
    </nav>

    <main>
      <section class="signup-form-container">
        <img
          src="Recursos/ic_launcher_round.webp"
          alt="Logo MidasWallet"
          class="form-logo"
        />

        <h2>Crear una cuenta</h2>

        <form id="signup-form">
          <div class="input-group">
            <label for="email">Correo Electrónico:</label>

            <input type="email" id="email" name="email" required />
          </div>

          <div class="input-group">
            <label for="password">Contraseña:</label>

            <input type="password" id="password" name="password" required />
          </div>

          <div class="input-group">
            <label for="confirm-password">Repetir Contraseña:</label>

            <input
              type="password"
              id="confirm-password"
              name="confirm-password"
              required
            />
          </div>

          <button type="submit" class="submit-btn">Crear cuenta</button>
        </form>

        <button id="google-signup-btn" class="google-btn">
          <img src="Recursos/google-icon.png" alt="Google Icon" />
          Registrarse con Google
        </button>

        <p class="login-link">
          ¿Ya tienes una cuenta?
          <a href="InicioSesion.html">Inicia Sesión</a>
        </p>

        <p id="error-message" class="error-message"></p>
      </section>
    </main>

    <footer>
      <p>Derechos reservados 2025 DevUp©</p>
    </footer>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
      import {
        getAuth,
        createUserWithEmailAndPassword,
        GoogleAuthProvider,
        signInWithPopup,
      } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js";
      const firebaseConfig = {
        apiKey: "AIzaSyBxIAoBbCAY67vWVBWqosyqZrco0br5FYg",
        authDomain: "midaswallet-b5bf0.firebaseapp.com",
        projectId: "midaswallet-b5bf0",
        storageBucket: "midaswallet-b5bf0.firebasestorage.app",
        messagingSenderId: "241859863208",
        appId: "1:241859863208:web:4ec137b9e95bf991d8189d",
        measurementId: "G-HZ0WY0K344",
      };
      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const googleProvider = new GoogleAuthProvider();
      const signupForm = document.getElementById("signup-form");
      const googleSignupBtn = document.getElementById("google-signup-btn");
      const errorMessage = document.getElementById("error-message");
      signupForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = signupForm["email"].value;
        const password = signupForm["password"].value;
        const confirmPassword = signupForm["confirm-password"].value;
        if (password !== confirmPassword) {
          errorMessage.textContent = "Las contraseñas no coinciden.";
          return;
        }
        try {
          await createUserWithEmailAndPassword(auth, email, password);
          window.location.href = "dashboard.html";
        } catch (error) {
          errorMessage.textContent = "Error: " + error.message;
        }
      });
      googleSignupBtn.addEventListener("click", async () => {
        try {
          await signInWithPopup(auth, googleProvider);
          window.location.href = "dashboard.html";
        } catch (error) {
          errorMessage.textContent = "Error: " + error.message;
        }
      });
    </script>
  </body>
</html>
